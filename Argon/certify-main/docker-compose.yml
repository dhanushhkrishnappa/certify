version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: certify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: certify
      POSTGRES_PASSWORD: certify_dev_password
      POSTGRES_DB: certify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certify -d certify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: certify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certify-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://certify:certify_dev_password@postgres:5432/certify_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-docker-jwt-secret-minimum-32-chars-2026
      AI_PROVIDER: deterministic
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

volumes:
  postgres_data:
