name = "certify-api"
main = "src/worker.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
PORT = "8787"
CORS_ORIGIN = "https://certify.studio, https://www.certify.studio, https://certify.pages.dev, http://localhost:5173"
BETTER_AUTH_URL = "https://api.certify.studio"
EMAIL_FROM = "certify.auth@gmail.com"
RULE_VERSION = "2026.1"
PROMPT_VERSION = "2026-10-v1"
ED25519_KEY_ID = "ed25519-2026-v1"

# Production bindings to be bound in Cloudflare dashboard
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "certify-private-artifacts"
