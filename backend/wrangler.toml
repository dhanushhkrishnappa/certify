name = "certify-api"
main = "src/worker.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "api.certify.studio", custom_domain = true }
]

[vars]
NODE_ENV = "production"
PORT = "8787"
CORS_ORIGIN = "https://certify.studio, https://www.certify.studio, https://certify.pages.dev, http://localhost:5173"
BETTER_AUTH_URL = "https://api.certify.studio"
EMAIL_FROM = "certify.auth@gmail.com"
RULE_VERSION = "2026.1"
PROMPT_VERSION = "2026-10-v1"
ED25519_KEY_ID = "certify-2026-key-1"
AI_PROVIDER = "gemini"
GEMINI_TUTOR_MODEL = "gemini-2.5-flash"
GEMINI_EVALUATOR_MODEL = "gemini-2.5-flash"
GROQ_TUTOR_MODEL = "llama-3.3-70b-versatile"
GROQ_EVALUATOR_MODEL = "llama-3.3-70b-versatile"

# Production bindings to be bound in Cloudflare dashboard
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "certify-private-artifacts"
